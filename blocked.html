<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#193024,#0f1e18);color:#f3efe6;font:17px/1.5 'Onest',-apple-system,system-ui,sans-serif;text-align:center;padding:24px}

h1 span{display:inline-block;padding:.04em .22em .1em;background:#ff5a4d;color:#2a0704;border-radius:8px;transform:rotate(-2deg)}
.hand{font:700 clamp(24px,3.4vw,34px)/1.15 'Caveat',cursive;margin:30px auto 8px;max-width:26ch}
p{color:#9bb0a5;margin:0 auto 32px;max-width:46ch}
a{display:inline-block;padding:18px 30px;border-radius:14px;font:800 16px 'Unbounded',sans-serif;color:#16241e;text-decoration:none;background:#e6ff4f;box-shadow:0 6px 0 #97a92e}
a:active{transform:translateY(5px);box-shadow:0 1px 0 #97a92e}
</style>
</head>
<body>
<div>
  <div class="wm">LOCK IN</div>
  <h1><span>Не сейчас</span></h1>

  <p>Строгий режим Lock In: сайта нет в списке разрешённых на эту сессию. Вернись к работе или заработай перерыв — объясни учителю, что ты уже сделал.</p>
  <a href="http://localhost:5173/">Вернуться в Lock In</a>
</div>
</body>
